x-flink-taskmanager: &flink-taskmanager-base
  build:
    context: ./flink
  image: big-data-project-flink-py:1.19.1
  command: taskmanager
  depends_on:
    - flink-jobmanager
  environment: &flink-taskmanager-env
    FLINK_PROPERTIES: |
      jobmanager.rpc.address: flink-jobmanager
      taskmanager.numberOfTaskSlots: 6
      parallelism.default: 3
      taskmanager.memory.process.size: 1200m

x-sensor-producer: &sensor-producer-base
  build:
    context: ./producer
  command: ["python", "sensor_producer.py"]
  environment: &sensor-producer-env
    KAFKA_BOOTSTRAP: kafka:29092
    KAFKA_TOPIC: trafic.raw_sensor
    POLL_INTERVAL_MS: "50"
    PRODUCER_COUNT: "3"
    TRAFFIC_DATA_FILE: /data/hanoi_traffic_train_data.json
    BASE_TIME: "2024-01-01T00:00:00"
    STEP_MINUTES: "15"
  volumes:
    - ./hanoi_traffic_train_data.json:/data/hanoi_traffic_train_data.json:ro
  depends_on:
    kafka-topic-init:
      condition: service_completed_successfully
  restart: unless-stopped

services:
  registry:
    image: registry:2
    ports:
      - "5000:5000"
    volumes:
      - registry-data:/var/lib/registry
    restart: unless-stopped

  flink-python-base:
    build:
      context: ./flink
    image: big-data-project-flink-py:1.19.1
    command: [ "true" ]
    profiles: [ "build-only" ]

  traffic-api:
    build:
      context: ./traffic-api
    environment:
      TRAFFIC_DATA_FILE: /data/hanoi_traffic_train_data.json
      BASE_TIME: "2024-01-01T00:00:00"
      STEP_MINUTES: "15"
    volumes:
      - ./hanoi_traffic_train_data.json:/data/hanoi_traffic_train_data.json:ro
    ports:
      - "18000:8000"
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000",
              "--workers", "4", "--no-access-log"]
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)" ]
      interval: 10s
      timeout: 5s
      retries: 12

  kafka:
    image: confluentinc/cp-kafka:7.7.1
    hostname: kafka
    ports:
      - "9092:9092"
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_LISTENERS: PLAINTEXT://kafka:29092,CONTROLLER://kafka:29093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      # JVM heap - giới hạn để tránh GC overhead với workload nhẹ
      KAFKA_HEAP_OPTS: "-Xmx512m -Xms512m -XX:+UseG1GC -XX:MaxGCPauseMillis=20"
      # Thread counts - giảm xuống vừa đủ cho 1 broker, 6 topics
      KAFKA_NUM_NETWORK_THREADS: "2"
      KAFKA_NUM_IO_THREADS: "4"
      KAFKA_BACKGROUND_THREADS: "4"
      # Log retention 2 giờ - tránh background log cleaner chạy trên data cũ
      KAFKA_LOG_RETENTION_MS: "7200000"
      KAFKA_LOG_SEGMENT_BYTES: "52428800"
      # Giảm log flush frequency - để OS tự flush thay vì flush mỗi message
      KAFKA_LOG_FLUSH_INTERVAL_MESSAGES: "10000"
      KAFKA_LOG_FLUSH_INTERVAL_MS: "1000"
    healthcheck:
      test: [ "CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 >/dev/null 2>&1" ]
      interval: 10s
      timeout: 10s
      retries: 12

  kafka-topic-init:
    image: confluentinc/cp-kafka:7.7.1
    depends_on:
      kafka:
        condition: service_healthy
    command:
      - bash
      - -lc
      - kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic trafic.raw_sensor --partitions 6 --replication-factor 1 && kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic trafic.raw_weather --partitions 6 --replication-factor 1 && kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic trafic.enriched_events --partitions 6 --replication-factor 1 && kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic trafic.predictions --partitions 6 --replication-factor 1 && kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic trafic.congestion_alerts --partitions 6 --replication-factor 1 && kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic trafic.accident_anomaly_alerts --partitions 6 --replication-factor 1 && kafka-topics --bootstrap-server kafka:29092 --describe --topic trafic.raw_sensor && kafka-topics --bootstrap-server kafka:29092 --describe --topic trafic.raw_weather && kafka-topics --bootstrap-server kafka:29092 --describe --topic trafic.enriched_events && kafka-topics --bootstrap-server kafka:29092 --describe --topic trafic.predictions && kafka-topics --bootstrap-server kafka:29092 --describe --topic trafic.congestion_alerts && kafka-topics --bootstrap-server kafka:29092 --describe --topic trafic.accident_anomaly_alerts
    restart: "no"

  redpanda-console:
    image: docker.redpanda.com/redpandadata/console:latest
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8082:8080"
    environment:
      KAFKA_BROKERS: kafka:29092
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports:
      - "16379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "19000:9000"
      - "19001:9001"
    volumes:
      - minio-data:/data
    restart: unless-stopped

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      - minio
    entrypoint: [ "/bin/sh" ]
    command:
      - -c
      - until mc alias set local http://minio:9000 minioadmin minioadmin; do sleep 2; done; mc mb --ignore-existing local/traffic-lake
    restart: "no"

  iceberg-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: iceberg
      POSTGRES_PASSWORD: iceberg
      POSTGRES_DB: iceberg
    volumes:
      - iceberg-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U iceberg -d iceberg" ]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  iceberg-rest:
    image: tabulario/iceberg-rest:1.6.0
    depends_on:
      iceberg-postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_REGION: us-east-1
      CATALOG_WAREHOUSE: s3://traffic-lake/warehouse
      CATALOG_CATALOG__IMPL: org.apache.iceberg.jdbc.JdbcCatalog
      CATALOG_URI: jdbc:postgresql://iceberg-postgres:5432/iceberg
      CATALOG_JDBC_USER: iceberg
      CATALOG_JDBC_PASSWORD: iceberg
      CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
      CATALOG_S3_ENDPOINT: http://minio:9000
      CATALOG_S3_PATH__STYLE__ACCESS: "true"
    ports:
      - "18181:8181"
    restart: unless-stopped

  trino:
    image: trinodb/trino:455
    mem_limit: 3g
    memswap_limit: 3g
    depends_on:
      kafka-topic-init:
        condition: service_completed_successfully
      iceberg-rest:
        condition: service_started
      minio-init:
        condition: service_completed_successfully
    volumes:
      - ./trino/catalog:/etc/trino/catalog:ro
      - ./trino/kafka:/etc/trino/kafka:ro
    ports:
      - "18083:8080"
    healthcheck:
      test: [ "CMD-SHELL", "trino --execute 'SELECT 1' >/dev/null 2>&1" ]
      interval: 10s
      timeout: 10s
      retries: 12
    restart: unless-stopped

  mlflow:
    build:
      context: ./mlflow
    depends_on:
      minio-init:
        condition: service_completed_successfully
    environment:
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_DEFAULT_REGION: us-east-1
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
    volumes:
      - mlflow-data:/mlflow
    ports:
      - "15000:5000"
    command:
      - sh
      - -c
      - mkdir -p /mlflow/db && exec mlflow server --host 0.0.0.0 --port 5000 --backend-store-uri sqlite:////mlflow/db/mlflow.db --serve-artifacts --artifacts-destination s3://traffic-lake/mlflow-artifacts
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health', timeout=2)" ]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  airflow-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - airflow-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U airflow -d airflow" ]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  airflow:
    build:
      context: ./airflow
    depends_on:
      airflow-postgres:
        condition: service_healthy
      kafka-topic-init:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
      mlflow:
        condition: service_healthy
      redis:
        condition: service_healthy
      trino:
        condition: service_healthy
    environment:
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__MAX_ACTIVE_RUNS_PER_DAG: "1"
      AIRFLOW__CORE__MAX_ACTIVE_TASKS_PER_DAG: "4"
      AIRFLOW__CORE__PARALLELISM: "8"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-postgres:5432/airflow
      AIRFLOW__SCHEDULER__DAG_DIR_LIST_INTERVAL: "30"
      AIRFLOW__SCHEDULER__MIN_FILE_PROCESS_INTERVAL: "30"
      AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "true"
      AIRFLOW_ADMIN_USERNAME: admin
      AIRFLOW_ADMIN_PASSWORD: admin
      AIRFLOW_ADMIN_EMAIL: admin@example.com
      KAFKA_BOOTSTRAP: kafka:29092
      KAFKA_TOPIC: trafic.enriched_events
      KAFKA_GROUP_ID: airflow-iceberg-offset-reader
      KAFKA_CONSUME_SECONDS: "45"
      KAFKA_MAX_RECORDS: "5000"
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: traffic-lake
      MINIO_PREFIX: traffic/enriched_events
      LOCAL_TIMEZONE: Asia/Ho_Chi_Minh
      LONGTERM_FEATURE_PREFIX: traffic/longterm_features/staging
      TRAINING_DATASET_PREFIX: traffic/training_datasets/kmeans_30m
      TRINO_HOST: trino
      TRINO_PORT: "8080"
      TRINO_USER: airflow
      TRINO_ICEBERG_CATALOG: iceberg
      TRINO_KAFKA_CATALOG: kafka
      ICEBERG_SCHEMA: traffic
      ICEBERG_ENRICHED_TABLE: enriched_events
      ICEBERG_LONGTERM_TABLE: longterm_features
      ICEBERG_TRAINING_TABLE: training_kmeans_30m
      ICEBERG_INGEST_OFFSET_VARIABLE: iceberg_ingest_offsets__trafic_enriched_events
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MLFLOW_EXPERIMENT_NAME: traffic-state-kmeans-30m
      KMEANS_MODEL_NAME: traffic_state_kmeans_30m
      KMEANS_N_CLUSTERS: "3"
      KMEANS_MIN_TRAIN_ROWS: "50"
      KMEANS_WAIT_TIMEOUT_SECONDS: "180"
      KMEANS_WAIT_POKE_SECONDS: "5"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_DB: "0"
      REDIS_TTL_SECONDS: "90000"
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - airflow-logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
      - ./airflow/config:/opt/airflow/config
    ports:
      - "8080:8080"
    command:
      - bash
      - -lc
      - |
        airflow db migrate
        airflow users create \
          --username "$${AIRFLOW_ADMIN_USERNAME}" \
          --firstname Admin \
          --lastname User \
          --role Admin \
          --email "$${AIRFLOW_ADMIN_EMAIL}" \
          --password "$${AIRFLOW_ADMIN_PASSWORD}" || true
        airflow scheduler &
        exec airflow webserver
    restart: unless-stopped

  airflow-train-model-once:
    build:
      context: ./airflow
    depends_on:
      airflow:
        condition: service_started
      traffic-sensor-producer-0:
        condition: service_started
      flink-enrich-job-submitter:
        condition: service_completed_successfully
      trino:
        condition: service_healthy
      mlflow:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-postgres:5432/airflow
      KAFKA_BOOTSTRAP: kafka:29092
      KAFKA_TOPIC: trafic.enriched_events
      KAFKA_GROUP_ID: airflow-iceberg-offset-reader
      LOCAL_TIMEZONE: Asia/Ho_Chi_Minh
      TRINO_HOST: trino
      TRINO_PORT: "8080"
      TRINO_USER: airflow
      TRINO_ICEBERG_CATALOG: iceberg
      TRINO_KAFKA_CATALOG: kafka
      ICEBERG_SCHEMA: traffic
      ICEBERG_ENRICHED_TABLE: enriched_events
      ICEBERG_LONGTERM_TABLE: longterm_features
      ICEBERG_TRAINING_TABLE: training_kmeans_30m
      ICEBERG_INGEST_OFFSET_VARIABLE: iceberg_ingest_offsets__trafic_enriched_events
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MLFLOW_EXPERIMENT_NAME: traffic-state-kmeans-30m
      KMEANS_MODEL_NAME: traffic_state_kmeans_30m
      KMEANS_N_CLUSTERS: "3"
      KMEANS_MIN_TRAIN_ROWS: "50"
      KMEANS_WAIT_TIMEOUT_SECONDS: "180"
      KMEANS_WAIT_POKE_SECONDS: "5"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_DB: "0"
      REDIS_TTL_SECONDS: "90000"
      BOOTSTRAP_TRAIN_WAIT_SECONDS: "60"
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - airflow-logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
      - ./airflow/config:/opt/airflow/config
    command:
      - bash
      - -lc
      - |
        airflow db check
        for i in {1..60}; do
          airflow dags list | grep -q "train_traffic_kmeans_30m" && break
          sleep 2
        done
        echo "Waiting $${BOOTSTRAP_TRAIN_WAIT_SECONDS}s for producer/Flink enriched events..."
        sleep "$${BOOTSTRAP_TRAIN_WAIT_SECONDS}"
        logical_date="$$(date -u +%Y-%m-%dT%H:%M:%S)"
        airflow dags test kafka_enriched_to_iceberg "$${logical_date}"
        airflow dags test compute_longterm_features "$${logical_date}"
        airflow dags test train_traffic_kmeans_30m "$${logical_date}"
    restart: "no"

  flink-jobmanager:
    build:
      context: ./flink
    image: big-data-project-flink-py:1.19.1
    command: jobmanager
    ports:
      - "8081:8081"
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        rest.bind-address: 0.0.0.0
        parallelism.default: 3
        cluster.evenly-spread-out-slots: true

  flink-taskmanager:
    <<: *flink-taskmanager-base

  flink-taskmanager-2:
    <<: *flink-taskmanager-base

  flink-taskmanager-3:
    <<: *flink-taskmanager-base

  traffic-sensor-producer-0:
    <<: *sensor-producer-base
    environment:
      <<: *sensor-producer-env
      PRODUCER_ID: "0"

  traffic-sensor-producer-1:
    <<: *sensor-producer-base
    environment:
      <<: *sensor-producer-env
      PRODUCER_ID: "1"

  traffic-sensor-producer-2:
    <<: *sensor-producer-base
    environment:
      <<: *sensor-producer-env
      PRODUCER_ID: "2"

  traffic-weather-producer:
    build:
      context: ./producer
    command: ["python", "weather_producer.py"]
    environment:
      API_BASE_URL: http://traffic-api:8000
      KAFKA_BOOTSTRAP: kafka:29092
      KAFKA_TOPIC: trafic.raw_weather
      POLL_INTERVAL_MS: "10000"
    depends_on:
      traffic-api:
        condition: service_healthy
      kafka-topic-init:
        condition: service_completed_successfully
    restart: unless-stopped

  traffic-anomaly-api:
    build:
      context: ./producer
    command: ["uvicorn", "anomaly_api:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      KAFKA_BOOTSTRAP: kafka:29092
      KAFKA_TOPIC: trafic.raw_sensor
    ports:
      - "18010:8000"
    depends_on:
      kafka-topic-init:
        condition: service_completed_successfully
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)" ]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  flink-enrich-job-submitter:
    image: big-data-project-flink-py:1.19.1
    environment:
      FLINK_PROPERTIES: |
        parallelism.default: 3
      KAFKA_BOOTSTRAP: kafka:29092
      SENSOR_TOPIC: trafic.raw_sensor
      WEATHER_TOPIC: trafic.raw_weather
      ENRICHED_TOPIC: trafic.enriched_events
      KAFKA_GROUP_ID: traffic-raw-to-enriched
    depends_on:
      kafka-topic-init:
        condition: service_completed_successfully
      flink-jobmanager:
        condition: service_started
      flink-taskmanager:
        condition: service_started
    command:
      - bash
      - -lc
      - for i in {1..60}; do flink list -m flink-jobmanager:8081 >/dev/null 2>&1 && break; sleep 2; done; if flink list -r -m flink-jobmanager:8081 | grep -q "raw-to-enriched-state-window"; then echo "Raw enrich job already running"; else flink run -d -m flink-jobmanager:8081 -C file:///opt/flink/lib/flink-sql-connector-kafka-3.2.0-1.19.jar -py /opt/flink/jobs/raw_to_enriched.py; fi
    restart: "no"

  flink-predict-job-submitter:
    image: big-data-project-flink-py:1.19.1
    environment:
      FLINK_PROPERTIES: |
        parallelism.default: 3
      KAFKA_BOOTSTRAP: kafka:29092
      ENRICHED_TOPIC: trafic.enriched_events
      PREDICTIONS_TOPIC: trafic.predictions
      KAFKA_GROUP_ID: traffic-enriched-to-predictions
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_DB: "0"
      MLFLOW_TRACKING_URI: http://mlflow:5000
      KMEANS_MODEL_NAME: traffic_state_kmeans_30m
      MODEL_REFRESH_RECORDS: "300"
    depends_on:
      kafka-topic-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      mlflow:
        condition: service_healthy
      flink-jobmanager:
        condition: service_started
      flink-taskmanager:
        condition: service_started
    command:
      - bash
      - -lc
      - for i in {1..60}; do flink list -m flink-jobmanager:8081 >/dev/null 2>&1 && break; sleep 2; done; if flink list -r -m flink-jobmanager:8081 | grep -q "enriched-to-kmeans-state-prediction-30m"; then echo "Prediction job already running"; else flink run -d -p 1 -m flink-jobmanager:8081 -C file:///opt/flink/lib/flink-sql-connector-kafka-3.2.0-1.19.jar -py /opt/flink/jobs/enriched_to_predictions.py; fi
    restart: "no"

  flink-congestion-cep-job-submitter:
    image: big-data-project-flink-py:1.19.1
    environment:
      FLINK_PROPERTIES: |
        parallelism.default: 3
      KAFKA_BOOTSTRAP: kafka:29092
      ENRICHED_TOPIC: trafic.enriched_events
      CONGESTION_ALERT_TOPIC: trafic.congestion_alerts
      KAFKA_GROUP_ID: traffic-congestion-cep-alerts
      CONGESTION_SPEED_THRESHOLD: "10"
      CONGESTION_CONSECUTIVE_EVENTS: "3"
      CONGESTION_DURATION_MINUTES: "30"
    depends_on:
      kafka-topic-init:
        condition: service_completed_successfully
      flink-jobmanager:
        condition: service_started
      flink-taskmanager:
        condition: service_started
    command:
      - bash
      - -lc
      - for i in {1..60}; do flink list -m flink-jobmanager:8081 >/dev/null 2>&1 && break; sleep 2; done; if flink list -r -m flink-jobmanager:8081 | grep -q "congestion-cep-alerts"; then echo "Congestion CEP job already running"; else flink run -d -p 2 -m flink-jobmanager:8081 -C file:///opt/flink/lib/flink-sql-connector-kafka-3.2.0-1.19.jar -py /opt/flink/jobs/congestion_cep_alerts.py; fi
    restart: "no"

  flink-accident-anomaly-job-submitter:
    image: big-data-project-flink-py:1.19.1
    environment:
      FLINK_PROPERTIES: |
        parallelism.default: 3
      KAFKA_BOOTSTRAP: kafka:29092
      ENRICHED_TOPIC: trafic.enriched_events
      ACCIDENT_ALERT_TOPIC: trafic.accident_anomaly_alerts
      KAFKA_GROUP_ID: traffic-accident-anomaly-alerts
      ACCIDENT_HISTORY_EVENTS: "6"
      ACCIDENT_SPIKE_MULTIPLIER: "3"
    depends_on:
      kafka-topic-init:
        condition: service_completed_successfully
      flink-jobmanager:
        condition: service_started
      flink-taskmanager:
        condition: service_started
    command:
      - bash
      - -lc
      - for i in {1..60}; do flink list -m flink-jobmanager:8081 >/dev/null 2>&1 && break; sleep 2; done; if flink list -r -m flink-jobmanager:8081 | grep -q "accident-anomaly-alerts"; then echo "Accident anomaly job already running"; else flink run -d -p 2 -m flink-jobmanager:8081 -C file:///opt/flink/lib/flink-sql-connector-kafka-3.2.0-1.19.jar -py /opt/flink/jobs/accident_anomaly_alerts.py; fi
    restart: "no"
  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    hostname: clickhouse
    ports:
      - "18123:8123"
    environment:
      CLICKHOUSE_DB: traffic_analytics
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ""
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./clickhouse/init:/docker-entrypoint-initdb.d:ro
    depends_on:
      kafka-topic-init:
        condition: service_completed_successfully
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: [ "CMD-SHELL", "clickhouse-client --query 'SELECT 1'" ]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped
  streamlit-alert:
    build:
      context: ./streamlit-alert
    environment:
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: "8123"
      CLICKHOUSE_DATABASE: traffic_analytics
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ""
    ports:
      - "8501:8501"
    depends_on:
      clickhouse:
        condition: service_healthy
      kafka-topic-init:
        condition: service_completed_successfully
    restart: unless-stopped
  superset:
    build:
      context: ./superset
    depends_on:
      clickhouse:
        condition: service_healthy
    environment:
      SUPERSET_SECRET_KEY: "change-this-to-a-long-random-secret"
      SQLALCHEMY_DATABASE_URI: sqlite:////app/superset_home/superset.db
    volumes:
      - ./superset/superset_config.py:/app/pythonpath/superset_config.py:ro
      - superset-home:/app/superset_home
    ports:
      - "8088:8088"
    command:
      - sh
      - -c
      - |
        superset db upgrade &&
        superset fab create-admin \
          --username admin \
          --firstname Superset \
          --lastname Admin \
          --email admin@example.com \
          --password admin || true &&
        superset init &&
            superset set-database-uri \
        -d clickhouse \
        -u "clickhousedb+connect://default:@clickhouse:8123/traffic_analytics" &&
        superset run -h 0.0.0.0 -p 8088
    restart: unless-stopped
volumes:
  registry-data:
  airflow-logs:
  airflow-postgres-data:
  iceberg-postgres-data:
  mlflow-data:
  minio-data:
  clickhouse-data:
  redis-data:
  superset-home:
  
