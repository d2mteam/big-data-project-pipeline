apiVersion: v1
kind: Namespace
metadata:
  name: traffic-streaming
---
apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: traffic-streaming
spec:
  selector:
    app: kafka
  ports:
    - name: broker
      port: 29092
      targetPort: 29092
    - name: controller
      port: 29093
      targetPort: 29093
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka
  namespace: traffic-streaming
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kafka
  template:
    metadata:
      labels:
        app: kafka
    spec:
      nodeSelector:
        traffic-node2: "true"
      containers:
        - name: kafka
          image: confluentinc/cp-kafka:7.7.1
          ports:
            - containerPort: 29092
            - containerPort: 29093
          env:
            - name: CLUSTER_ID
              value: MkU3OEVBNTcwNTJENDM2Qk
            - name: KAFKA_NODE_ID
              value: "1"
            - name: KAFKA_PROCESS_ROLES
              value: broker,controller
            - name: KAFKA_CONTROLLER_QUORUM_VOTERS
              value: 1@kafka:29093
            - name: KAFKA_LISTENERS
              value: PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093
            - name: KAFKA_ADVERTISED_LISTENERS
              value: PLAINTEXT://kafka:29092
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
            - name: KAFKA_INTER_BROKER_LISTENER_NAME
              value: PLAINTEXT
            - name: KAFKA_CONTROLLER_LISTENER_NAMES
              value: CONTROLLER
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
              value: "1"
            - name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS
              value: "0"
            - name: KAFKA_AUTO_CREATE_TOPICS_ENABLE
              value: "true"
          readinessProbe:
            exec:
              command: ["/bin/bash", "-lc", "kafka-broker-api-versions --bootstrap-server localhost:29092 >/dev/null 2>&1"]
            initialDelaySeconds: 20
            periodSeconds: 10
---
apiVersion: batch/v1
kind: Job
metadata:
  name: kafka-topic-init
  namespace: traffic-streaming
spec:
  template:
    spec:
      restartPolicy: OnFailure
      nodeSelector:
        traffic-node2: "true"
      containers:
        - name: topic-init
          image: confluentinc/cp-kafka:7.7.1
          command:
            - bash
            - -lc
            - |
              until kafka-broker-api-versions --bootstrap-server kafka:29092 >/dev/null 2>&1; do sleep 2; done
              kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic trafic.raw_sensor --partitions 3 --replication-factor 1
              kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic trafic.raw_weather --partitions 3 --replication-factor 1
              kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic trafic.enriched_events --partitions 3 --replication-factor 1
              kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic trafic.congestion_alerts --partitions 3 --replication-factor 1
              kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic trafic.accident_anomaly_alerts --partitions 3 --replication-factor 1
              kafka-topics --bootstrap-server kafka:29092 --list
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redpanda-console
  namespace: traffic-streaming
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redpanda-console
  template:
    metadata:
      labels:
        app: redpanda-console
    spec:
      nodeSelector:
        traffic-node2: "true"
      containers:
        - name: redpanda-console
          image: docker.redpanda.com/redpandadata/console:latest
          env:
            - name: KAFKA_BROKERS
              value: kafka:29092
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: redpanda-console
  namespace: traffic-streaming
spec:
  type: NodePort
  selector:
    app: redpanda-console
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      nodePort: 30082
---
apiVersion: v1
kind: Service
metadata:
  name: flink-jobmanager
  namespace: traffic-streaming
spec:
  selector:
    app: flink-jobmanager
  ports:
    - name: ui
      port: 8081
      targetPort: 8081
    - name: rpc
      port: 6123
      targetPort: 6123
---
apiVersion: v1
kind: Service
metadata:
  name: flink-ui
  namespace: traffic-streaming
spec:
  type: NodePort
  selector:
    app: flink-jobmanager
  ports:
    - name: ui
      port: 8081
      targetPort: 8081
      nodePort: 30081
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flink-jobmanager
  namespace: traffic-streaming
spec:
  replicas: 1
  selector:
    matchLabels:
      app: flink-jobmanager
  template:
    metadata:
      labels:
        app: flink-jobmanager
    spec:
      nodeSelector:
        traffic-node2: "true"
      containers:
        - name: jobmanager
          image: big-data-project-flink-py:1.19.1
          imagePullPolicy: IfNotPresent
          args: ["jobmanager"]
          env:
            - name: FLINK_PROPERTIES
              value: |
                jobmanager.rpc.address: flink-jobmanager
                rest.bind-address: 0.0.0.0
                parallelism.default: 1
          ports:
            - containerPort: 8081
            - containerPort: 6123
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flink-taskmanager
  namespace: traffic-streaming
spec:
  replicas: 1
  selector:
    matchLabels:
      app: flink-taskmanager
  template:
    metadata:
      labels:
        app: flink-taskmanager
    spec:
      nodeSelector:
        traffic-node2: "true"
      containers:
        - name: taskmanager
          image: big-data-project-flink-py:1.19.1
          imagePullPolicy: IfNotPresent
          args: ["taskmanager"]
          env:
            - name: FLINK_PROPERTIES
              value: |
                jobmanager.rpc.address: flink-jobmanager
                taskmanager.numberOfTaskSlots: 4
                parallelism.default: 1
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: traffic-api
  namespace: traffic-streaming
spec:
  replicas: 1
  selector:
    matchLabels:
      app: traffic-api
  template:
    metadata:
      labels:
        app: traffic-api
    spec:
      nodeSelector:
        traffic-node2: "true"
      containers:
        - name: traffic-api
          image: big-data-project-traffic-api:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: TRAFFIC_DATA_FILE
              value: /data/hanoi_traffic_train_data.json
            - name: BASE_TIME
              value: "2024-01-01T00:00:00"
            - name: STEP_MINUTES
              value: "15"
          ports:
            - containerPort: 8000
          volumeMounts:
            - name: traffic-data
              mountPath: /data
              readOnly: true
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: traffic-data
          hostPath:
            path: /data/traffic
            type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: traffic-api
  namespace: traffic-streaming
spec:
  selector:
    app: traffic-api
  ports:
    - name: http
      port: 8000
      targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: traffic-sensor-producer
  namespace: traffic-streaming
spec:
  replicas: 1
  selector:
    matchLabels:
      app: traffic-sensor-producer
  template:
    metadata:
      labels:
        app: traffic-sensor-producer
    spec:
      nodeSelector:
        traffic-node2: "true"
      containers:
        - name: sensor-producer
          image: big-data-project-traffic-sensor-producer:latest
          imagePullPolicy: IfNotPresent
          command: ["python", "sensor_producer.py"]
          env:
            - name: API_BASE_URL
              value: http://traffic-api:8000
            - name: KAFKA_BOOTSTRAP
              value: kafka:29092
            - name: KAFKA_TOPIC
              value: trafic.raw_sensor
            - name: POLL_INTERVAL_MS
              value: "1000"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: traffic-weather-producer
  namespace: traffic-streaming
spec:
  replicas: 1
  selector:
    matchLabels:
      app: traffic-weather-producer
  template:
    metadata:
      labels:
        app: traffic-weather-producer
    spec:
      nodeSelector:
        traffic-node2: "true"
      containers:
        - name: weather-producer
          image: big-data-project-traffic-sensor-producer:latest
          imagePullPolicy: IfNotPresent
          command: ["python", "weather_producer.py"]
          env:
            - name: API_BASE_URL
              value: http://traffic-api:8000
            - name: KAFKA_BOOTSTRAP
              value: kafka:29092
            - name: KAFKA_TOPIC
              value: trafic.raw_weather
            - name: POLL_INTERVAL_MS
              value: "10000"
---
apiVersion: batch/v1
kind: Job
metadata:
  name: flink-enrich-job-submitter
  namespace: traffic-streaming
spec:
  template:
    spec:
      restartPolicy: OnFailure
      nodeSelector:
        traffic-node2: "true"
      containers:
        - name: submitter
          image: big-data-project-flink-py:1.19.1
          imagePullPolicy: IfNotPresent
          env:
            - name: KAFKA_BOOTSTRAP
              value: kafka:29092
            - name: SENSOR_TOPIC
              value: trafic.raw_sensor
            - name: WEATHER_TOPIC
              value: trafic.raw_weather
            - name: ENRICHED_TOPIC
              value: trafic.enriched_events
            - name: KAFKA_GROUP_ID
              value: traffic-raw-to-enriched
          command:
            - bash
            - -lc
            - |
              for i in {1..90}; do flink list -m flink-jobmanager:8081 >/dev/null 2>&1 && break; sleep 2; done
              flink run -d -m flink-jobmanager:8081 -C file:///opt/flink/lib/flink-sql-connector-kafka-3.2.0-1.19.jar -py /opt/flink/jobs/raw_to_enriched.py
---
apiVersion: batch/v1
kind: Job
metadata:
  name: flink-congestion-cep-job-submitter
  namespace: traffic-streaming
spec:
  template:
    spec:
      restartPolicy: OnFailure
      nodeSelector:
        traffic-node2: "true"
      containers:
        - name: submitter
          image: big-data-project-flink-py:1.19.1
          imagePullPolicy: IfNotPresent
          env:
            - name: KAFKA_BOOTSTRAP
              value: kafka:29092
            - name: ENRICHED_TOPIC
              value: trafic.enriched_events
            - name: CONGESTION_ALERT_TOPIC
              value: trafic.congestion_alerts
          command:
            - bash
            - -lc
            - |
              for i in {1..90}; do flink list -m flink-jobmanager:8081 >/dev/null 2>&1 && break; sleep 2; done
              flink run -d -m flink-jobmanager:8081 -C file:///opt/flink/lib/flink-sql-connector-kafka-3.2.0-1.19.jar -py /opt/flink/jobs/congestion_cep_alerts.py
---
apiVersion: batch/v1
kind: Job
metadata:
  name: flink-accident-anomaly-job-submitter
  namespace: traffic-streaming
spec:
  template:
    spec:
      restartPolicy: OnFailure
      nodeSelector:
        traffic-node2: "true"
