            - -lc
            - |
              for i in {1..90}; do flink list -m flink-jobmanager:8081 >/dev/null 2>&1 && break; sleep 2; done
              flink run -d -m flink-jobmanager:8081 -C file:///opt/flink/lib/flink-sql-connector-kafka-3.2.0-1.19.jar -py /opt/flink/jobs/accident_anomaly_alerts.py
